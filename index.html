<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0010" />
  <title>UMBRA — Links</title>
  <meta name="description" content="Official links for Umbra. Join the Discord or visit umbracheats.app." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="UMBRA — Links" />
  <meta property="og:description" content="Official links for Umbra." />
  <meta property="og:url" content="https://umbracheats.app/" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-0: #05000a;
      --bg-1: #0a0014;
      --bg-2: #14002a;
      --violet: #8a2bff;
      --violet-soft: #b066ff;
      --violet-deep: #4a0080;
      --ink: #ece6ff;
      --ink-dim: #9a8cc4;
      --ring: rgba(176, 102, 255, 0.35);
      --card: rgba(20, 6, 36, 0.55);
      --card-border: rgba(176, 102, 255, 0.18);
      --card-border-hot: rgba(176, 102, 255, 0.55);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100svh;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg-0);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Layered background: deep gradient + animated aurora + grain */
    .bg {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(1200px 800px at 50% -10%, rgba(138, 43, 255, 0.35), transparent 60%),
        radial-gradient(900px 700px at 100% 100%, rgba(74, 0, 128, 0.45), transparent 60%),
        radial-gradient(700px 600px at 0% 80%, rgba(176, 102, 255, 0.12), transparent 60%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    }
    .aurora {
      position: fixed; inset: -20%; z-index: -1;
      filter: blur(80px);
      opacity: 0.55;
      pointer-events: none;
    }
    .aurora span {
      position: absolute; display: block;
      width: 50vmax; height: 50vmax; border-radius: 50%;
      mix-blend-mode: screen;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .aurora .a1 { background: radial-gradient(circle, rgba(138, 43, 255, 0.55), transparent 60%); top: -10%; left: -10%; }
    .aurora .a2 { background: radial-gradient(circle, rgba(176, 102, 255, 0.45), transparent 60%); bottom: -15%; right: -10%; animation-duration: 28s; animation-delay: -6s; }
    .aurora .a3 { background: radial-gradient(circle, rgba(74, 0, 128, 0.6), transparent 60%); top: 30%; left: 30%; width: 35vmax; height: 35vmax; animation-duration: 34s; animation-delay: -12s; }

    @keyframes drift {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(4vw, -3vh, 0) scale(1.08); }
      100% { transform: translate3d(-3vw, 4vh, 0) scale(0.96); }
    }

    /* Subtle grain so it doesn't feel flat */
    .grain {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      opacity: 0.06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
    }

    main {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
      padding: clamp(48px, 10vh, 96px) 24px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Eclipse logo */
    .mark {
      position: relative;
      width: 116px; height: 116px;
      margin-bottom: 28px;
      display: grid; place-items: center;
    }
    .mark::before {
      content: ""; position: absolute; inset: -28px; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(176, 102, 255, 0.45), transparent 60%);
      filter: blur(14px);
      animation: breathe 6s ease-in-out infinite;
    }
    .mark svg { position: relative; width: 100%; height: 100%; display: block; }

    @keyframes breathe {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.08); }
    }

    .brand {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: clamp(40px, 7vw, 56px);
      letter-spacing: 0.32em;
      margin: 0;
      padding-left: 0.32em; /* optical compensation for tracking */
      background: linear-gradient(180deg, #ffffff 0%, #d6c2ff 60%, #8a2bff 130%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(138, 43, 255, 0.25);
    }

    .tag {
      margin: 10px 0 0;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    .tag .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #34d399; box-shadow: 0 0 10px #34d399;
      vertical-align: middle; margin: -2px 8px 0 0;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.85); }
    }

    .links {
      width: 100%;
      margin-top: 44px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .card {
      --glow: rgba(176, 102, 255, 0.0);
      position: relative;
      display: flex; align-items: center; gap: 16px;
      padding: 18px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      transition: transform 220ms cubic-bezier(.2,.7,.2,1),
                  border-color 220ms ease,
                  background 220ms ease,
                  box-shadow 220ms ease;
      overflow: hidden;
      isolation: isolate;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: radial-gradient(220px 120px at var(--mx, 50%) var(--my, 50%), var(--glow), transparent 60%);
      opacity: 0; transition: opacity 220ms ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--card-border-hot);
      background: rgba(28, 8, 52, 0.65);
      box-shadow: 0 10px 40px -10px rgba(138, 43, 255, 0.45),
                  0 0 0 1px rgba(176, 102, 255, 0.25);
      outline: none;
    }
    .card:hover::before, .card:focus-visible::before { opacity: 1; }

    .card .icon {
      flex: 0 0 44px; height: 44px; width: 44px;
      display: grid; place-items: center;
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(176, 102, 255, 0.18), rgba(74, 0, 128, 0.35));
      border: 1px solid rgba(176, 102, 255, 0.25);
      box-shadow: inset 0 0 18px rgba(176, 102, 255, 0.18);
    }
    .card .icon svg { width: 22px; height: 22px; }

    .card .label {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      flex: 1;
    }
    .card .name {
      font-weight: 600; font-size: 16px; letter-spacing: 0.04em;
    }
    .card .sub {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px; color: var(--ink-dim);
      letter-spacing: 0.05em;
    }
    .card .arrow {
      flex: 0 0 auto; opacity: 0.5;
      transition: transform 220ms ease, opacity 220ms ease;
    }
    .card:hover .arrow, .card:focus-visible .arrow {
      transform: translateX(3px);
      opacity: 1;
    }

    .card.discord { --glow: rgba(120, 90, 255, 0.35); }
    .card.site    { --glow: rgba(176, 102, 255, 0.35); }

    footer {
      margin-top: 56px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-dim);
      opacity: 0.7;
    }
    footer a { color: var(--violet-soft); text-decoration: none; }
    footer a:hover { color: #fff; }

    /* Reveal animation */
    .reveal { opacity: 0; transform: translateY(8px); animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .reveal.d1 { animation-delay: .05s; }
    .reveal.d2 { animation-delay: .15s; }
    .reveal.d3 { animation-delay: .25s; }
    .reveal.d4 { animation-delay: .35s; }
    .reveal.d5 { animation-delay: .45s; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .aurora span, .mark::before, .tag .dot, .reveal { animation: none !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true">
    <span class="a1"></span><span class="a2"></span><span class="a3"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <div class="mark reveal d1" aria-hidden="true">
      <!-- Eclipse: dark disc occluding a violet corona, with a thin crescent of light -->
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="corona" cx="50%" cy="50%" r="50%">
            <stop offset="40%" stop-color="#b066ff" stop-opacity="0"/>
            <stop offset="62%" stop-color="#b066ff" stop-opacity="0.85"/>
            <stop offset="78%" stop-color="#8a2bff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#8a2bff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#b066ff" stop-opacity="0.2"/>
          </linearGradient>
          <mask id="crescent">
            <rect width="120" height="120" fill="black"/>
            <circle cx="60" cy="60" r="40" fill="white"/>
            <circle cx="66" cy="58" r="37" fill="black"/>
          </mask>
        </defs>
        <circle cx="60" cy="60" r="56" fill="url(#corona)"/>
        <circle cx="60" cy="60" r="40" fill="#05000a" stroke="url(#ring)" stroke-width="1"/>
        <rect width="120" height="120" fill="#ece6ff" mask="url(#crescent)" opacity="0.95"/>
      </svg>
    </div>

    <h1 class="brand reveal d2">UMBRA</h1>
    <p class="tag reveal d3"><span class="dot"></span>Status — Online</p>

    <nav class="links" aria-label="Umbra links">
      <a class="card discord reveal d4" href="https://discord.gg/umbrag" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3.2a.07.07 0 0 0-.075.035c-.211.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.073.073 0 0 0-.075-.034 19.736 19.736 0 0 0-3.76 1.169.067.067 0 0 0-.031.026C2.533 8.046 1.86 11.62 2.19 15.149a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.027c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.041-.105 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.04.106c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-4.177-.838-7.72-3.548-10.755a.061.061 0 0 0-.03-.027ZM8.02 13.001c-1.182 0-2.157-1.085-2.157-2.418 0-1.334.957-2.42 2.157-2.42 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.974 0c-1.183 0-2.157-1.085-2.157-2.418 0-1.334.956-2.42 2.157-2.42 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z" fill="#b066ff"/>
          </svg>
        </span>
        <span class="label">
          <span class="name">Discord</span>
          <span class="sub">discord.gg/umbrag</span>
        </span>
        <span class="arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </span>
      </a>

      <a class="card site reveal d5" href="https://umbracheats.app" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#b066ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18"/>
            <path d="M12 3a14 14 0 0 1 0 18"/>
            <path d="M12 3a14 14 0 0 0 0 18"/>
          </svg>
        </span>
        <span class="label">
          <span class="name">Website</span>
          <span class="sub">umbracheats.app</span>
        </span>
        <span class="arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </span>
      </a>
    </nav>

    <footer class="reveal d5">
      © <span id="yr"></span> Umbra · all rights reserved
    </footer>
  </main>

  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();

    // Pointer-tracked glow on cards
    document.querySelectorAll(".card").forEach((el) => {
      el.addEventListener("pointermove", (e) => {
        const r = el.getBoundingClientRect();
        el.style.setProperty("--mx", ((e.clientX - r.left) / r.width) * 100 + "%");
        el.style.setProperty("--my", ((e.clientY - r.top) / r.height) * 100 + "%");
      });
    });
  </script>
</body>
</html>
